<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceribro · Viveros El Tambo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="core.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="m_directorio.jsx"></script>
  <script type="text/babel" src="m_calidad.jsx"></script>
  <script type="text/babel" src="m_modulos.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [profile, setProfile] = useState(null);
      const [moduleId, setModuleId] = useState(null);

      const handlePick = (key) => {
        const p = PROFILES[key];
        setProfile(p);
        // default landing per profile
        if (key === 'directorio') setModuleId('directory');
        else if (key === 'calidad') setModuleId('quality-dash');
        else if (key === 'campo') setModuleId('campo');
        else if (key === 'comercial') setModuleId('dashboard');
        else if (key === 'produccion') setModuleId('dashboard');
        else setModuleId('dashboard');
      };

      const handleLogout = () => {
        if (confirm('¿Cerrar sesión y volver a la selección de perfil?')) {
          setProfile(null);
          setModuleId(null);
        }
      };

      if (!profile) {
        return <Login onPick={handlePick} />;
      }

      const renderModule = () => {
        // Calidad sub-modules
        if (moduleId === 'quality-dash' || (moduleId && moduleId.startsWith('q-'))) {
          return <ModuleCalidad moduleId={moduleId} goTo={setModuleId} />;
        }
        switch (moduleId) {
          case 'dashboard':  return <ModuleDashboard profile={profile} />;
          case 'directory':  return <ModuleDirectorio />;
          case 'contracts':  return <ModuleContratos />;
          case 'client':     return <ModuleClientes />;
          case 'postsale':   return <ModulePostventa />;
          case 'alerts':     return <ModuleAlertas />;
          case 'process-room': return <ModuleSalaProceso />;
          case 'vid':        return <ModuleVid />;
          case 'parrones':   return <ModuleParrones />;
          case 'materials':  return <ModuleMateriales />;
          case 'logistics':  return <ModuleLogistica />;
          case 'activities': return <ModuleActividades />;
          case 'calendar':   return <ModuleCalendario />;
          case 'lots':       return <ModuleLotes />;
          case 'quality':    return <ModuleLiberacion />;
          case 'money':      return <ModuleCostos />;
          case 'masters':    return <ModuleMaestros />;
          case 'campo':      return <CampoMovil />;
          default: return (
            <div className="empty">
              <div className="empty-icon"><Icon name="info" size={22}/></div>
              <div className="empty-title">Selecciona un módulo</div>
              <div className="empty-msg">Usa el menú lateral para navegar.</div>
            </div>
          );
        }
      };

      return (
        <AppShell
          profile={profile}
          currentModule={moduleId}
          setModule={setModuleId}
          onLogout={handleLogout}
        >
          {renderModule()}
        </AppShell>
      );
    }

    function Root() {
      return (
        <ToastProvider>
          <App />
        </ToastProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
